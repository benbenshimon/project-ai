<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון בסיסי</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .calculator-screen {
            width: 100%;
            height: 80px;
            background-color: #2e2e2e;
            color: #fff;
            text-align: right;
            font-size: 3em;
            padding: 0 15px;
            box-sizing: border-box;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .calculator-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 15px;
        }

        button {
            height: 70px;
            background-color: #f7f7f7;
            border: none;
            border-radius: 8px;
            font-size: 1.8em;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background-color: #ff9500;
            color: #fff;
        }

        .operator:hover {
            background-color: #e08500;
        }

        .equal-sign {
            grid-column: span 2;
            background-color: #28a745;
        }

        .equal-sign:hover {
            background-color: #218838;
        }

        .all-clear {
            background-color: #dc3545;
            color: #fff;
        }

        .all-clear:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="calculator-screen" value="" disabled />

        <div class="calculator-keys">
            <button type="button" class="operator" value="+">+</button>
            <button type="button" class="operator" value="-">-</button>
            <button type="button" class="operator" value="*">&times;</button>
            <button type="button" class="operator" value="/">÷</button>

            <button type="button" value="7">7</button>
            <button type="button" value="8">8</button>
            <button type="button" value="9">9</button>

            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="6">6</button>

            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>

            <button type="button" value="0">0</button>
            <button type="button" class="decimal" value=".">.</button>
            <button type="button" class="all-clear" value="all-clear">AC</button>

            <button type="button" class="equal-sign operator" value="=">=</button>
        </div>
    </div>

    <script>
        const calculator = document.querySelector('.calculator');
        const keys = calculator.querySelector('.calculator-keys');
        const display = calculator.querySelector('.calculator-screen');

        let firstValue = '';
        let operator = '';
        let secondValue = '';

        keys.addEventListener('click', e => {
            if (!e.target.matches('button')) return;

            const key = e.target;
            const action = key.value;

            if (!isNaN(parseFloat(action)) || action === '.') {
                if (operator === '') {
                    if (action === '.' && firstValue.includes('.')) return;
                    firstValue += action;
                    display.value = firstValue;
                } else {
                    if (action === '.' && secondValue.includes('.')) return;
                    secondValue += action;
                    display.value = secondValue;
                }
            }

            if (action === '+' || action === '-' || action === '*' || action === '/') {
                if (firstValue !== '' && secondValue === '') {
                    operator = action;
                } else if (firstValue !== '' && secondValue !== '') {
                    const calcResult = operate(firstValue, secondValue, operator);
                    display.value = calcResult;
                    firstValue = String(calcResult);
                    secondValue = '';
                    operator = action;
                }
            }

            if (action === '=') {
                if (firstValue !== '' && secondValue !== '' && operator !== '') {
                    const calcResult = operate(firstValue, secondValue, operator);
                    display.value = calcResult;
                    firstValue = String(calcResult);
                    secondValue = '';
                    operator = '';
                }
            }

            if (action === 'all-clear') {
                firstValue = '';
                operator = '';
                secondValue = '';
                display.value = '';
            }
        });

        function operate(num1, num2, op) {
            const n1 = parseFloat(num1);
            const n2 = parseFloat(num2);

            switch (op) {
                case '+':
                    return n1 + n2;
                case '-':
                    return n1 - n2;
                case '*':
                    return n1 * n2;
                case '/':
                    if (n2 === 0) {
                        return 'שגיאה';
                    }
                    return n1 / n2;
            }
        }
    </script>
</body>
</html>
